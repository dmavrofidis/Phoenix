name: Phoenix Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.PHOENIX_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PHOENIX_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PHOENIX_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PHOENIX_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"

      - name: Prepare ephemeral signing
        working-directory: mobile
        env:
          KEYSTORE_BASE64: ${{ secrets.PHOENIX_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PHOENIX_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PHOENIX_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PHOENIX_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/phoenix-upload.jks
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=phoenix-upload.jks"
          } > android/key.properties

      - name: Quality gates
        working-directory: mobile
        run: |
          flutter pub get
          dart run build_runner build
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

      - name: Build signed AAB
        working-directory: mobile
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/symbols

      - uses: actions/upload-artifact@v4
        with:
          name: phoenix-android-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
