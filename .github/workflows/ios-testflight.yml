name: Phoenix iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Upload the signed IPA to App Store Connect
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: phoenix-ios-testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 50
    env:
      PHOENIX_BUNDLE_ID: com.phoenix.fitness
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Validate signing secrets
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "$IOS_DISTRIBUTION_CERTIFICATE_BASE64"
          test -n "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD"
          test -n "$IOS_PROVISIONING_PROFILE_BASE64"
          test -n "$APPLE_TEAM_ID"

      - name: Prepare ephemeral Apple signing
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          signing_dir="$RUNNER_TEMP/phoenix-signing"
          keychain_path="$RUNNER_TEMP/phoenix-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate_path="$signing_dir/distribution.p12"
          profile_path="$signing_dir/phoenix.mobileprovision"
          profile_plist="$signing_dir/profile.plist"

          echo "PHOENIX_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          mkdir -p "$signing_dir"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$profile_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

          security cms -D -i "$profile_path" > "$profile_plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"
          profile_bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")"

          case "$profile_bundle_id" in
            *."$PHOENIX_BUNDLE_ID") ;;
            *)
              echo "Provisioning profile does not match $PHOENIX_BUNDLE_ID." >&2
              exit 1
              ;;
          esac

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          echo "PHOENIX_PROFILE_UUID=$profile_uuid" >> "$GITHUB_ENV"
          echo "PHOENIX_PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"

      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Static analysis
        working-directory: mobile
        run: flutter analyze --no-pub

      - name: Tests
        working-directory: mobile
        run: flutter test --no-pub

      - name: Prepare Flutter iOS release
        working-directory: mobile
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --no-pub \
            --build-name 1.1.0 \
            --build-number "${{ github.run_number }}"

      - name: Archive signed iOS application
        working-directory: mobile
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/ios/archive/Phoenix.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$PHOENIX_BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PHOENIX_PROFILE_NAME" \
            MARKETING_VERSION=1.1.0 \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive

      - name: Export signed IPA
        working-directory: mobile
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          export_options="$RUNNER_TEMP/PhoenixExportOptions.plist"
          cat > "$export_options" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>$PHOENIX_BUNDLE_ID</key>
              <string>$PHOENIX_PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath build/ios/archive/Phoenix.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist "$export_options"

          ipa_path="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$ipa_path"
          shasum -a 256 "$ipa_path" > build/ios/phoenix-ios-sha256.txt
          echo "PHOENIX_IPA_PATH=$PWD/$ipa_path" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: phoenix-ios-ipa-${{ github.run_number }}
          path: |
            mobile/build/ios/ipa/*.ipa
            mobile/build/ios/phoenix-ios-sha256.txt
            mobile/build/ios/archive/Phoenix.xcarchive/dSYMs
          if-no-files-found: error
          retention-days: 14

      - name: Validate App Store Connect secrets
        if: ${{ inputs.upload_to_testflight }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$APP_STORE_CONNECT_API_KEY_ID"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          test -n "$APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64"

      - name: Upload to TestFlight
        if: ${{ inputs.upload_to_testflight }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          key_dir="$HOME/.appstoreconnect/private_keys"
          key_path="$key_dir/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"
          mkdir -p "$key_dir"
          printf '%s' "$APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64" | base64 -D > "$key_path"
          chmod 600 "$key_path"
          echo "PHOENIX_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

          xcrun altool \
            --upload-app \
            --type ios \
            --file "$PHOENIX_IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Remove ephemeral signing material
        if: ${{ always() }}
        run: |
          if [[ -n "${PHOENIX_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$PHOENIX_KEYCHAIN_PATH" || true
          fi
          if [[ -n "${PHOENIX_PROFILE_UUID:-}" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PHOENIX_PROFILE_UUID.mobileprovision"
          fi
          rm -rf "$RUNNER_TEMP/phoenix-signing"
          rm -f "$RUNNER_TEMP/PhoenixExportOptions.plist"
          if [[ -n "${PHOENIX_API_KEY_PATH:-}" ]]; then
            rm -f "$PHOENIX_API_KEY_PATH"
          fi
