name: Phoenix Android Test APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-debug.yml"

permissions:
  contents: read

concurrency:
  group: phoenix-android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build installable test APK
        working-directory: mobile
        run: flutter build apk --debug

      - name: Write checksum
        working-directory: mobile
        run: sha256sum build/app/outputs/flutter-apk/app-debug.apk > build/phoenix-debug-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: phoenix-android-debug-${{ github.run_number }}
          path: |
            mobile/build/app/outputs/flutter-apk/app-debug.apk
            mobile/build/phoenix-debug-sha256.txt
          if-no-files-found: error
          retention-days: 14
